<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CivicAction: From Complaints to Action</title>
<link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel=stylesheet>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--n:#12263a;--t:#0f766e;--b:#f3f5f6;--tx:#1a2733;--m:#66768a;--r:#c8372d}
*{box-sizing:border-box;margin:0}body{font:14px 'Public Sans',system-ui,sans-serif;background:var(--b);color:var(--tx)}
.shell{display:flex;min-height:100vh}.side{width:226px;background:var(--n);color:#c5d2e0;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;flex:none}
.side b{color:#fff;font-size:18px;padding:4px 10px 16px;display:block}.side a{padding:10px 12px;border-radius:6px;cursor:pointer}.side a:hover,.side a.on{background:#1f3b57;color:#fff}
main{flex:1;padding:26px;max-width:1180px;min-width:0}h2{margin-bottom:6px}h3{margin-bottom:6px;font-size:15px}
.card{background:#fff;border-radius:8px;padding:18px;border:1px solid #e3e8ec;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}.grid>.card{margin:0}
.k{font-size:28px;font-weight:700}.m{color:var(--m);font-size:12px}
input,select,textarea,button{font:inherit;padding:9px 11px;border:1px solid #cfd7de;border-radius:6px;width:100%;background:#fff}
button{background:var(--t);color:#fff;border:0;cursor:pointer;width:auto;font-weight:600}button.g{background:#e3e8ec;color:var(--tx)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--t);outline-offset:2px}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:12px}a{color:var(--t);cursor:pointer}
.bd{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;display:inline-block;white-space:nowrap}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px;vertical-align:top}tr.r{cursor:pointer}tr.r:hover{background:#f6f8f9}.sc{overflow-x:auto}
.stp{display:flex;gap:4px;margin:12px 0}.stp div{flex:1;text-align:center;padding:7px 2px;font-size:11px;background:#e3e8ec;border-radius:5px}.stp .on{background:var(--t);color:#fff}
.map{height:420px;border-radius:8px}
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.hero{background:linear-gradient(160deg,#12263a,#0f5e63);color:#fff;padding:56px}
main{animation:f .25s}@keyframes f{from{opacity:0}}@media(prefers-reduced-motion:reduce){main{animation:none}}
@media(max-width:800px){.login{grid-template-columns:1fr}.hero{padding:28px}.shell{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;align-items:center}.side b{display:none}.side a{white-space:nowrap}main{padding:16px}}
</style></head><body><div id=app></div><script>
const $=s=>document.querySelector(s),C=["Roads & Potholes","Drainage & Waterlogging","Garbage & Waste","Streetlights","Water Supply","Public Sanitation","Other"],ST=["Submitted","Under Review","Assigned","In Progress","Resolved"];
const PC={High:"#c8372d",Medium:"#d98a0b",Low:"#2f8f4e"},SC=["#66768a","#2b7bb9","#6b5bd2","#d98a0b","#2f8f4e"],PAL=["#0f766e","#12263a","#d98a0b","#c8372d","#2b7bb9","#6b5bd2","#66768a"];
let S={token:localStorage.t||"",user:null,meta:null},mp,mk,pin,role="citizen",reg=false;
const pb=p=>`<span class=bd style="background:${PC[p]}">${p}</span>`,sb=s=>`<span class=bd style="background:${SC[ST.indexOf(s)]}">${s}</span>`;
const opt=(a,v)=>a.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join(""),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),ago=t=>new Date(t).toLocaleDateString();
async function api(p,o={}){const r=await fetch("/api"+p,{method:o.method||"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+S.token},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
function loginPage(){$("#app").innerHTML=`<div class=login><div class=hero><h1 style="font-size:40px;margin-bottom:12px">CivicAction</h1><p style="font-size:18px;opacity:.9;max-width:460px">From complaints to action. Citizen reports become prioritised, explained and trackable work for the authorities who fix them.</p>
<div class=grid style="margin-top:34px;max-width:540px;grid-template-columns:1fr 1fr">${[["Capture","Report with text, a photo and a map pin."],["Understand","AI sorts, summarises, flags duplicates and scores priority."],["Reveal","Hotspots, trends and recurring problems."],["Act","Assign, update and resolve. Citizens see every step."]].map(x=>`<div style="background:#ffffff1a;padding:14px;border-radius:8px"><b>${x[0]}</b><div style="font-size:12px;opacity:.85;margin-top:4px">${x[1]}</div></div>`).join("")}</div></div>
<div style="display:grid;place-items:center;padding:24px"><form class=card style="width:100%;max-width:400px" onsubmit="auth(event)"><h2>${reg?"Create a citizen account":"Sign in"}</h2><div class=stp>${["citizen","admin"].map(r=>`<div class="${r==role?"on":""}" style="cursor:pointer;padding:10px;font-size:13px" onclick="setRole('${r}')">${r=="admin"?"Authority":"Citizen"}</div>`).join("")}</div>
${reg?`<label>Full name</label><input name=name required>`:""}<label>Email</label><input name=email type=email required><label>Password</label><input name=password type=password required minlength=6>
<p id=err style="color:var(--r);margin-top:8px"></p><button style="width:100%;margin-top:10px">${reg?"Create account":"Sign in as "+(role=="admin"?"Authority":"Citizen")}</button>
${role=="citizen"?`<p class=m style="margin-top:12px"><a onclick="toggleReg()">${reg?"Already registered? Sign in":"New here? Create an account"}</a></p>`:""}
<p class=m style="margin-top:14px">Prototype demo accounts: demo@citizen.local / citizen123 and admin@civic.local / admin123</p></form></div></div>`}
function setRole(r){role=r;reg=false;loginPage()}
function toggleReg(){reg=!reg;loginPage()}
async function auth(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const r=await api(reg?"/register":"/login",{method:"POST",body:{...f,role}});S.token=localStorage.t=r.token;S.user=r.user;shell()}catch(x){$("#err").textContent=x.message}}
const NAV={citizen:[["home","Dashboard"],["submit","Submit complaint"],["mine","My complaints"],["profile","Profile"]],admin:[["dash","Dashboard"],["manage","Complaints"],["map","Map & hotspots"],["ai","AI insights"],["profile","Profile"]]};
function shell(){const u=S.user;$("#app").innerHTML=`<div class=shell><nav class=side><b>CivicAction<span class=m style="display:block;font-weight:400;color:#8fa3b8">${u.role=="admin"?"Authority console":"Citizen portal"}</span></b>${NAV[u.role].map(n=>`<a id="n-${n[0]}" onclick="go('${n[0]}')">${n[1]}</a>`).join("")}<span style="flex:1"></span><a onclick="out()">Sign out</a></nav><main id=main></main></div>`;go(NAV[u.role][0][0])}
function out(){localStorage.t="";S.token="";S.user=null;loginPage()}
async function go(v,a){document.querySelectorAll(".side a").forEach(x=>x.classList.toggle("on",x.id=="n-"+v));try{await V[v](a)}catch(e){if(/sign in/i.test(e.message))return out();$("#main").innerHTML=`<div class=card>${esc(e.message)}</div>`}}
const kpi=(l,v,c="")=>`<div class=card><div class=m>${l}</div><div class=k style="color:${c}">${v}</div></div>`;
const tbl=r=>`<div class=sc><table><tr><th>ID<th>Summary<th>Category<th>Priority<th>Status<th>Date</tr>${r.map(x=>`<tr class=r onclick="go('detail','${x.cid}')"><td>${x.cid}<td>${esc(x.summary)}${x.dup_of?` <span class=m>(duplicate of ${x.dup_of})</span>`:""}<td>${x.category}<td>${pb(x.priority)}<td>${sb(x.status)}<td>${ago(x.created)}</tr>`).join("")||"<tr><td colspan=6 class=m>No complaints match.</tr>"}</table></div>`;
const hot=h=>h.map(x=>`<p style="margin:8px 0"><b>${x.area}</b>: ${x.count} ${x.category} reports within about 450 m (${x.open} still open)</p>`).join("")||"<p class=m>No hotspots yet.</p>";
const ch=(id,type,l,d,col)=>new Chart($("#"+id),{type,data:{labels:l,datasets:[{data:d,backgroundColor:col||"#0f766e",borderColor:"#0f766e",tension:.3}]},options:{plugins:{legend:{display:type=="doughnut"}},maintainAspectRatio:false}});
const V={};
V.home=async()=>{const[r,up]=await Promise.all([api("/complaints"),api("/updates")]),n=s=>r.filter(x=>x.status==s).length;
$("#main").innerHTML=`<h2>Welcome, ${esc(S.user.name.split(" ")[0])}</h2><p class=m>Report a civic issue and follow it through to resolution.</p><div class=grid style="margin:16px 0">${kpi("My complaints",r.length)}${kpi("Open",r.length-n("Resolved"),"#d98a0b")}${kpi("Resolved",n("Resolved"),"#2f8f4e")}</div><button onclick="go('submit')">Submit a complaint</button>
<div class="grid two" style="margin-top:16px"><div class=card><h3>Latest updates</h3>${up.map(x=>`<p style="margin:8px 0"><b>${x.cid}</b> ${sb(x.status)}<br><span class=m>${esc(x.note)} (${ago(x.ts)})</span></p>`).join("")||"<p class=m>No updates yet. Submit your first complaint.</p>"}</div><div class=card><h3>Recent complaints</h3>${tbl(r.slice(0,5))}</div></div>`};
V.mine=async()=>{const r=await api("/complaints");$("#main").innerHTML=`<h2>My complaints</h2><div class=card>${tbl(r)}</div>`};
const tile=m=>L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}).addTo(m);
function setPin(a,b,z){pin=[a,b];mk?mk.setLatLng(pin):mk=L.marker(pin).addTo(mp);if(z)mp.setView(pin,z)}
const jump=v=>{if(v){const p=S.meta.zones[v];setPin(p.lat,p.lng,15)}},geo=()=>navigator.geolocation?.getCurrentPosition(p=>setPin(p.coords.latitude,p.coords.longitude,16),()=>alert("Location unavailable. Click the map instead."));
V.submit=async()=>{const z=S.meta.zones,f=Object.values(z)[0];
$("#main").innerHTML=`<h2>Submit a complaint</h2><form class=card onsubmit="sub(event)"><label>What is the problem?</label><textarea name=description rows=4 required minlength=15 placeholder="What is wrong, where exactly, and who is affected?"></textarea>
<div class="grid two"><div><label>Category</label><select name=category><option value="">Detect automatically (AI)</option>${C.map(c=>`<option>${c}</option>`).join("")}</select></div><div><label>Jump map to area</label><select onchange="jump(this.value)"><option value="">Select an area</option>${Object.keys(z).map(k=>`<option>${k}</option>`).join("")}</select></div></div>
<label>Location: click the map to drop a pin</label><div id=pm class=map style="height:300px"></div><button type=button class=g style="margin-top:8px" onclick="geo()">Use my current location</button>
<label>Photo (optional, max 600 KB)</label><input type=file id=img accept="image/*"><p id=err style="color:var(--r);margin:8px 0"></p><button>Submit complaint</button></form><div id=res></div>`;
pin=mk=null;mp=L.map("pm").setView([f.lat,f.lng],13);tile(mp);mp.on("click",e=>setPin(e.latlng.lat,e.latlng.lng))};
async function sub(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),er=$("#err");er.textContent="";if(!pin)return er.textContent="Drop a pin on the map first.";
let image=null;const fl=$("#img").files[0];if(fl){if(fl.size>6e5)return er.textContent="Image is too large. Use one under 600 KB.";image=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(fl)})}
try{const r=await api("/complaints",{method:"POST",body:{description:f.description,category:f.category,lat:pin[0],lng:pin[1],image}});e.target.style.display="none";
$("#res").innerHTML=`<div class=card><h3>Complaint ${r.cid} submitted</h3><p class=m style="margin-bottom:8px">Result of the AI analysis</p><p><b>Category:</b> ${r.category} <span class=m>(AI read it as ${r.ai_category}, ${Math.round(r.confidence*100)}% keyword match)</span></p><p style="margin:8px 0"><b>Summary:</b> ${esc(r.summary)}</p>
<p><b>Duplicate check:</b> ${r.dup_of?`Similar to ${r.dup_of} (${Math.round(r.dup_score*100)}% text match, within 400 m). Linked so authorities handle them together.`:"No duplicate found."}</p><p style="margin:8px 0"><b>Priority:</b> ${pb(r.priority)}</p><p class=m style="margin-bottom:12px">${esc(r.reason)}</p><button onclick="go('detail','${r.cid}')">Track this complaint</button></div>`}catch(x){er.textContent=x.message}}
V.detail=async cid=>{const d=await api("/complaints/"+cid),ad=S.user.role=="admin",i=ST.indexOf(d.status);
$("#main").innerHTML=`<button class=g onclick="go('${ad?"manage":"mine"}')">Back</button><h2 style="margin:12px 0">${d.cid} ${sb(d.status)} ${pb(d.priority)}</h2>
<div class="grid two" style="align-items:start"><div class=card><h3>Complaint</h3><p style="margin:8px 0">${esc(d.description)}</p><p class=m>${d.category} | ${d.area} | ${ago(d.created)}${d.reporter?" | reported by "+esc(d.reporter):""}</p>${d.image?`<img src="${d.image}" alt="Complaint photo" style="max-width:100%;border-radius:6px;margin-top:10px">`:""}
<div class=stp>${ST.map((s,k)=>`<div class="${k<=i?"on":""}">${s}</div>`).join("")}</div><p class=m>Department: ${d.dept||"not yet assigned"}</p><h3 style="margin-top:14px">Timeline</h3>${d.updates.map(u=>`<p style="margin:8px 0">${sb(u.status)} <span class=m>${ago(u.ts)}</span><br>${esc(u.note)}</p>`).join("")}</div>
<div><div class=card><h3>AI analysis</h3><p style="margin:8px 0"><b>Summary:</b> ${esc(d.summary)}</p><p><b>Category read by AI:</b> ${d.ai_category} <span class=m>(${Math.round(d.confidence*100)}% keyword match)</span></p><p style="margin:8px 0"><b>Priority score:</b> ${d.score}/100</p><p class=m>${esc(d.reason)}</p>${d.dup_of?`<p style="margin-top:8px"><b>Duplicate of</b> <a onclick="go('detail','${d.dup_of}')">${d.dup_of}</a> (${Math.round(d.dup_score*100)}% match)</p>`:""}</div>
${ad?`<div class=card><h3>Action brief (generated)</h3><p style="margin-top:6px">${esc(d.brief)}</p></div><form class=card onsubmit="upd(event,'${d.cid}')"><h3>Update this complaint</h3><label>Department</label><select name=dept><option value="">None</option>${opt(S.meta.depts,d.dept||d.suggested)}</select><label>Status</label><select name=status>${opt(ST,d.status)}</select><label>Resolution note (visible to the citizen)</label><textarea name=note rows=2></textarea><p id=err style="color:var(--r);margin:8px 0"></p><button>Save changes</button></form>`:""}</div></div>`};
async function upd(e,cid){e.preventDefault();try{await api("/complaints/"+cid,{method:"PUT",body:Object.fromEntries(new FormData(e.target))});go("detail",cid)}catch(x){$("#err").textContent=x.message}}
V.manage=async()=>{const s=(id,ph,a)=>`<select id=${id} onchange="fm()"><option value="">${ph}</option>${a.map(x=>`<option>${x}</option>`).join("")}</select>`;
$("#main").innerHTML=`<h2>Complaints</h2><div class=card><div class=grid style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><input id=fq placeholder="Search text or ID" oninput="fm()">${s("fc","All categories",C)}${s("fa","All areas",Object.keys(S.meta.zones))}${s("fp","All priorities",["High","Medium","Low"])}${s("fs","All statuses",ST)}<label style="margin:0;display:flex;gap:6px;align-items:center"><input type=checkbox id=fd onchange="fm()" style="width:auto">Duplicates only</label></div></div><div class=card id=tb></div>`;fm()};
async function fm(){const q=new URLSearchParams({q:$("#fq").value,category:$("#fc").value,area:$("#fa").value,priority:$("#fp").value,status:$("#fs").value,dup:$("#fd").checked?1:""}),r=await api("/complaints?"+q);$("#tb").innerHTML=`<p class=m>${r.length} complaints</p>`+tbl(r)}
V.dash=async()=>{const s=await api("/stats"),c=i=>`<div style="height:240px"><canvas id=${i}></canvas></div>`,K=o=>[Object.keys(o),Object.values(o)];
$("#main").innerHTML=`<h2>Overview</h2><div class=grid style="margin:14px 0">${kpi("Total complaints",s.total)}${kpi("Pending",s.pending,"#d98a0b")}${kpi("Resolved",s.resolved,"#2f8f4e")}${kpi("High priority (open)",s.high,"#c8372d")}${kpi("Avg. resolution",s.avg_hours+" h")}${kpi("Duplicates linked",s.dup_count)}</div>
<div class="grid two"><div class=card><h3>By category</h3>${c("c1")}</div><div class=card><h3>By area</h3>${c("c2")}</div><div class=card><h3>Complaints per day (last 30 days)</h3>${c("c3")}</div><div class=card><h3>By status</h3>${c("c4")}</div></div><div class=card style="margin-top:16px"><h3>Hotspots</h3>${hot(s.hotspots)}</div>`;
ch("c1","doughnut",...K(s.by_category),PAL);ch("c2","bar",...K(s.by_area));ch("c3","line",s.trend.map(x=>x[0].slice(5)),s.trend.map(x=>x[1]));ch("c4","bar",ST,ST.map(x=>s.by_status[x]||0),SC)};
V.map=async()=>{const[s,r]=await Promise.all([api("/stats"),api("/complaints")]);
$("#main").innerHTML=`<h2>Map & hotspots</h2><div class=card><div id=am class=map style="height:520px"></div><p class=m style="margin-top:8px">Marker colour shows AI priority (red high, amber medium, green low). Red rings mark hotspots: three or more reports within about 450 m.</p></div><div class=card><h3>Hotspots</h3>${hot(s.hotspots)}</div>`;
const m=L.map("am"),b=[];tile(m);r.forEach(x=>{L.circleMarker([x.lat,x.lng],{radius:7,color:"#fff",weight:1,fillColor:PC[x.priority],fillOpacity:.9}).addTo(m).bindPopup(`<b>${x.cid}</b> ${x.status}<br>${esc(x.summary)}<br>${x.category}`);b.push([x.lat,x.lng])});
s.hotspots.forEach(h=>L.circle([h.lat,h.lng],{radius:300,color:"#c8372d",fillOpacity:.12}).addTo(m).bindPopup(`<b>Hotspot</b>: ${h.count} ${h.category} reports in ${h.area}`));b.length?m.fitBounds(b,{padding:[30,30]}):m.setView([20,78],12)};
V.ai=async()=>{const s=await api("/stats");
$("#main").innerHTML=`<h2>AI insights</h2><p class=m style="margin-bottom:14px">Everything here is computed by this platform's own NLP, TF-IDF similarity and clustering code. See the README for how.</p>
<div class=card><h3>Priority queue: explanations and action briefs</h3>${s.top.map(x=>`<div style="border-bottom:1px solid #edf0f3;padding:10px 0"><a onclick="go('detail','${x.cid}')"><b>${x.cid}</b></a> ${pb(x.priority)} ${sb(x.status)}<p style="margin:6px 0">${esc(x.reason)}</p><p class=m>${esc(x.brief)}</p></div>`).join("")||"<p class=m>No open complaints.</p>"}</div>
<div class="grid two" style="align-items:start"><div class=card><h3>Duplicate groups</h3>${s.duplicates.map(x=>`<p style="margin:8px 0"><a onclick="go('detail','${x.root}')">${x.root}</a> in ${x.area} has ${x.duplicates.length} duplicate(s): ${x.duplicates.join(", ")}<br><span class=m>${esc(x.summary)}</span></p>`).join("")||"<p class=m>No duplicates detected.</p>"}</div>
<div class=card><h3>Recurring issues</h3>${s.recurring.map(x=>`<p style="margin:8px 0"><b>${x.area}</b>: ${x.category}, ${x.count} reports</p>`).join("")||"<p class=m>None yet.</p>"}</div></div><div class=card><h3>Geographic hotspots</h3>${hot(s.hotspots)}</div>`};
V.profile=async()=>{const u=S.user;$("#main").innerHTML=`<h2>My profile</h2><form class=card style="max-width:480px;margin-top:12px" onsubmit="saveP(event)"><label>Full name</label><input name=name value="${esc(u.name)}" required><label>Email</label><input value="${esc(u.email)}" disabled><label>Account type</label><input value="${u.role=="admin"?"Authority":"Citizen"}" disabled><label>Phone (optional)</label><input name=phone value="${esc(u.phone)}"><label>Home area</label><select name=area>${opt(Object.keys(S.meta.zones),u.area)}</select><p id=err class=m style="margin:8px 0"></p><button>Save profile</button></form>`};
async function saveP(e){e.preventDefault();try{S.user=await api("/me",{method:"PUT",body:Object.fromEntries(new FormData(e.target))});$("#err").textContent="Profile saved."}catch(x){$("#err").textContent=x.message}}
(async()=>{S.meta=await api("/meta");if(S.token)try{S.user=await api("/me");return shell()}catch{}loginPage()})();
</script></body></html>
